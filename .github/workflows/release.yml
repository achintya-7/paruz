name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and decide whether to release
        id: resolve
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Explicit tag push — always release that tag.
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=true
          else
            # Merge to main — release only when package.json carries a version
            # that has not been tagged yet, so ordinary merges are no-ops.
            VERSION=$(jq -r .version package.json)
            if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
              RELEASE=false
            else
              RELEASE=true
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE" == "true" ]]; then
            echo "Releasing v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v${VERSION} is already tagged — nothing to release. Bump the version in package.json to cut a release." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # @opentui/core ships per-platform native binaries, so each target is built
          # on its own native runner rather than cross-compiled.
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-14
            target: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun build --compile --minify src/index.tsx --outfile paruz

      - name: Create release archive
        run: |
          tar -czf paruz-${{ matrix.target }}.tar.gz paruz
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum paruz-${{ matrix.target }}.tar.gz > paruz-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 paruz-${{ matrix.target }}.tar.gz > paruz-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paruz-${{ matrix.target }}
          path: |
            paruz-${{ matrix.target }}.tar.gz
            paruz-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Homebrew formula
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          SHA_ARM=$(cut -d' ' -f1 dist/paruz-darwin-arm64.tar.gz.sha256)
          SHA_LINUX=$(cut -d' ' -f1 dist/paruz-linux-x86_64.tar.gz.sha256)
          sed -e "s/@VERSION@/${VERSION}/g" \
              -e "s/@SHA_DARWIN_ARM64@/${SHA_ARM}/g" \
              -e "s/@SHA_LINUX_X86_64@/${SHA_LINUX}/g" \
              Formula/paruz.rb.tmpl > dist/paruz.rb
          cat dist/paruz.rb

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit when the run came from a merge to main.
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            dist/paruz-linux-x86_64.tar.gz
            dist/paruz-linux-x86_64.tar.gz.sha256
            dist/paruz-darwin-arm64.tar.gz
            dist/paruz-darwin-arm64.tar.gz.sha256
            dist/paruz.rb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
