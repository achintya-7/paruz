name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # @opentui/core ships per-platform native binaries, so each target is built
          # on its own native runner rather than cross-compiled.
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-13
            target: darwin-x86_64
          - os: macos-14
            target: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun build --compile --minify src/index.tsx --outfile paruz

      - name: Create release archive
        run: |
          tar -czf paruz-${{ matrix.target }}.tar.gz paruz
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum paruz-${{ matrix.target }}.tar.gz > paruz-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 paruz-${{ matrix.target }}.tar.gz > paruz-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paruz-${{ matrix.target }}
          path: |
            paruz-${{ matrix.target }}.tar.gz
            paruz-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_ARM=$(cut -d' ' -f1 dist/paruz-darwin-arm64.tar.gz.sha256)
          SHA_X86=$(cut -d' ' -f1 dist/paruz-darwin-x86_64.tar.gz.sha256)
          SHA_LINUX=$(cut -d' ' -f1 dist/paruz-linux-x86_64.tar.gz.sha256)
          sed -e "s/@VERSION@/${VERSION}/g" \
              -e "s/@SHA_DARWIN_ARM64@/${SHA_ARM}/g" \
              -e "s/@SHA_DARWIN_X86_64@/${SHA_X86}/g" \
              -e "s/@SHA_LINUX_X86_64@/${SHA_LINUX}/g" \
              Formula/paruz.rb.tmpl > dist/paruz.rb
          cat dist/paruz.rb

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/paruz-linux-x86_64.tar.gz
            dist/paruz-linux-x86_64.tar.gz.sha256
            dist/paruz-darwin-x86_64.tar.gz
            dist/paruz-darwin-x86_64.tar.gz.sha256
            dist/paruz-darwin-arm64.tar.gz
            dist/paruz-darwin-arm64.tar.gz.sha256
            dist/paruz.rb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
